[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-autoreroll"
version = "1.0.0"
description = "Auto Reroll Bot for game automation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]

[project.dependencies]
pyautogui = ">=0.9.53"
Pillow = ">=10.1.0"
pytesseract = ">=0.3.10"
opencv-python = ">=4.8.1.78"
numpy = ">=1.24.3"
requests = ">=2.31.0"
python-dotenv = ">=1.0.0"
customtkinter = ">=5.2.0"
pydirectinput = ">=1.0.4"
keyboard = ">=0.13.5"
PyQt5 = ">=5.15.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0"
]

[tool.setuptools]
packages = ["silver_autoreroll"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']

[tool.isort]
profile = "black"
line_length = 100
